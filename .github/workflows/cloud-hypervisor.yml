name: cloud-hypervisor
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  #TODO change to upstream once https://github.com/cloud-hypervisor/cloud-hypervisor/pull/8965 is merged
  CH_REPO: lukasfrank/cloud-hypervisor
  CH_REF: feat/arm-acpi
  RELEASE_TAG: cloud-hypervisor-fw_cfg
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: "-aarch64"
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout cloud-hypervisor
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CH_REPO }}
          ref: ${{ env.CH_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential pkg-config musl-tools
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build cloud-hypervisor (--features fw_cfg)
        run: |
          # cloud-hypervisor's default features (io_uring, kvm) plus fw_cfg,
          # built as a static musl binary for portability.
          cargo build --release --target ${{ matrix.target }} \
            --bin cloud-hypervisor --features fw_cfg
          BIN_DIR="target/${{ matrix.target }}/release"
          ls -l "$BIN_DIR/cloud-hypervisor"
          "$BIN_DIR/cloud-hypervisor" --version
          # cloud-hypervisor built with --features fw_cfg exposes --fw-cfg-config.
          "$BIN_DIR/cloud-hypervisor" --help | grep -q fw-cfg-config
      - name: Stage artifacts
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p out
          cp "$BIN_DIR/cloud-hypervisor" "out/cloud-hypervisor-static${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ch-${{ matrix.arch }}
          path: out/*
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          RELEASE_NOTES=$(mktemp)
          {
            echo "cloud-hypervisor built with \`--features fw_cfg\` for the cloud-hypervisor-provider."
            echo ""
            echo '```'
            echo "repo: ${CH_REPO}"
            echo "ref:  ${CH_REF}"
            echo '```'
            echo ""
            echo "Built by GitHub actions run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo ""
            echo "Upstream cloud-hypervisor is licensed under Apache-2.0 / BSD-3-Clause; see https://github.com/cloud-hypervisor/cloud-hypervisor."
          } > "$RELEASE_NOTES"
          # Recreate the (non-latest) release so the tag always points at the newest build.
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --latest=false \
            --title "cloud-hypervisor (fw_cfg) ${CH_REF}" \
            --notes-file "$RELEASE_NOTES" \
            dist/*
